services:
  postgres:
    image: postgres:16-alpine
    container_name: opera_drive_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: operadrive
      POSTGRES_PASSWORD: operadrive_secret
      POSTGRES_DB: operadrive_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U operadrive -d operadrive_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: alpine/minio:latest-release
    container_name: opera_drive_minio
    restart: unless-stopped
    user: "0:0"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  minio_data: